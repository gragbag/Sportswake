# Outlet list. This is the only editorial decision the system makes -- it
# selects sources, never topics. Start with three to prove the pipeline, then
# grow toward ~30 at milestone 2.
#
# Finding feeds: check /rss or /feeds on the outlet's site, or view-source and
# look for <link rel="alternate" type="application/rss+xml">.
#
# Verify each URL returns XML in a browser before adding it here.

feeds:
  - name: NPR News
    url: https://feeds.npr.org/1001/rss.xml

  - name: BBC News (World)
    url: https://feeds.bbci.co.uk/news/world/rss.xml

  - name: The Guardian (World)
    url: https://www.theguardian.com/world/rss