# Outlet list. This is the only editorial decision the system makes -- it
# selects sources, never topics.
#
# Finding feeds: check /rss or /feeds on the outlet's site, or view-source and
# look for <link rel="alternate" type="application/rss+xml">. Many outlets also
# declare a richer Google News sitemap in robots.txt.
#
# VERIFY BEFORE ADDING. A feed can return HTTP 200 with well-formed XML and
# still be abandoned -- CNN's top-stories feed serves items three years old,
# and WSJ's world feed is eighteen months stale. Check the newest item's
# timestamp, not the status code.
#
# All URLs below verified 2026-08-04: newest item under 8 hours old.
#
# Renaming an outlet here does NOT rename it in the database. sync_outlets
# inserts with ON CONFLICT DO NOTHING on feed_url, so the original name sticks.
# Changing a URL creates a SECOND outlet row; it does not replace the first.

feeds:
  # --- High-volume nationals -------------------------------------------
  # These form the clusters. A story only groups if several outlets cover it,
  # so the set needs enough breadth for major events to overlap.

  - name: NPR News
    url: https://feeds.npr.org/1001/rss.xml

  - name: The New York Times
    url: https://rss.nytimes.com/services/xml/rss/nyt/HomePage.xml

  - name: CBS News
    url: https://www.cbsnews.com/latest/rss/main

  - name: NBC News
    url: http://feeds.nbcnews.com/nbcnews/public/news

  - name: ABC News
    url: https://abcnews.go.com/abcnews/topstories

  - name: Fox News
    url: https://moxie.foxnews.com/google-publisher/latest.xml

  - name: PBS NewsHour
    url: https://www.pbs.org/newshour/feeds/rss/headlines

  - name: Los Angeles Times
