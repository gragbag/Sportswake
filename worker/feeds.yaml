# Outlet list. This is the only editorial decision the system makes -- it
# selects sources, never topics.
#
# Finding feeds: check /rss or /feeds on the outlet's site, or view-source and
# look for <link rel="alternate" type="application/rss+xml">.
#
# VERIFY BEFORE ADDING, and check three things rather than one:
#   1. HTTP 200 and it parses
#   2. the NEWEST item is hours old, not months -- a feed can be well-formed
#      and abandoned
#   3. items carry a description. That becomes articles.lede, which is three
#      quarters of what the embedder sees. Headlines alone cluster badly.
#
# Renaming an outlet here does NOT rename it in the database. sync_outlets
# inserts with ON CONFLICT DO NOTHING on feed_url, so the original name
# sticks. Changing a URL creates a SECOND outlet row rather than replacing it.
#
# All URLs verified 2026-08-15.

feeds:
  # --- NBA national --------------------------------------------------------
  # The core of the corpus. A story only clusters when several outlets cover
  # it, so these need to cover the whole league rather than a single team.

  - name: ESPN NBA
    url: https://www.espn.com/espn/rss/nba/news

  - name: CBS Sports NBA
    url: https://www.cbssports.com/rss/headlines/nba/

  - name: Yahoo Sports NBA
    url: https://sports.yahoo.com/nba/rss.xml

  - name: SB Nation NBA
    url: https://www.sbnation.com/rss/nba/index.xml

  - name: Guardian NBA
    url: https://www.theguardian.com/sport/nba/rss

  - name: Sportsnaut NBA
    url: https://sportsnaut.com/category/nba/feed/

  - name: NY Post NBA
    url: https://nypost.com/nba/feed/

  - name: Fadeaway World
    url: https://fadeawayworld.net/feed

  # --- Transactions and rumours --------------------------------------------
  # The highest-value tier for this product. Measured on the general-news
  # corpus, transfer and transaction stories were what actually clustered
  # across outlets; routine results did not. These two report exactly that,
  # so they should turn up in a large share of multi-outlet stories.

  - name: Hoops Rumors
    url: https://www.hoopsrumors.com/feed

  - name: RealGM Wiretap
    url: https://basketball.realgm.com/rss/wiretap/0/0.xml

  # --- Basketball beyond the NBA -------------------------------------------
  # NBA rosters, draft prospects and offseason moves route through Europe
  # constantly. These will also produce stories with no NBA team in them,
  # which is what LEAGUE and the empty-team-list case exist for.

  - name: Talkbasket
    url: https://www.talkbasket.net/feed

  - name: Eurohoops
    url: https://www.eurohoops.net/en/feed/

  - name: Sportando
    url: https://sportando.basketball/en/feed/

  # --- NBA verticals of general-sport outlets -------------------------------
  # These replaced the outlets' all-sport feeds on day one. The general feeds
  # clustered with EACH OTHER on non-NBA stories -- two carried the same MLB
  # milestone, which cleared the 2-outlet floor and put baseball in the feed.
  # Scoping the source is the fix that keeps "select sources, never topics"
  # true. Named with an NBA suffix because a changed URL creates a NEW outlet
  # row: the old rows keep their articles and simply stop growing.
  # (Athlon Sports had no NBA-scoped feed and is in the rejected list.)

  - name: Sporting News NBA
    url: https://www.sportingnews.com/us/rss/nba

  - name: Yardbarker NBA
    url: https://www.yardbarker.com/rss/sport/3

  # --- Team sites -----------------------------------------------------------
  # SB Nation's per-team network. Started as a big-market-five pilot; the
  # pilot measured 50-93% of their articles landing in multi-outlet stories
  # -- the best confirmation ratios in the roster -- so the rest of the
  # network followed. Low volume and single-team by design: they confirm
  # clusters on team stories, and later they power coverage gaps ("outlets
  # that normally cover this team and didn't"). Eleven of the thirty sites
  # are dead (see rejected block); this is every one that still publishes.

  - name: Silver Screen and Roll
    url: https://www.silverscreenandroll.com/rss/index.xml

  - name: CelticsBlog
    url: https://www.celticsblog.com/rss/index.xml

  - name: Golden State of Mind
    url: https://www.goldenstateofmind.com/rss/index.xml

  - name: Posting and Toasting
    url: https://www.postingandtoasting.com/rss/index.xml

  - name: Liberty Ballers
    url: https://www.libertyballers.com/rss/index.xml

  - name: Peachtree Hoops
    url: https://www.peachtreehoops.com/rss/index.xml

  - name: NetsDaily
    url: https://www.netsdaily.com/rss/index.xml

  - name: Fear The Sword
    url: https://www.fearthesword.com/rss/index.xml

  - name: Mavs Moneyball
    url: https://www.mavsmoneyball.com/rss/index.xml

  - name: Detroit Bad Boys
    url: https://www.detroitbadboys.com/rss/index.xml

  - name: The Dream Shake
    url: https://www.thedreamshake.com/rss/index.xml

  - name: Brew Hoop
    url: https://www.brewhoop.com/rss/index.xml

  - name: Canis Hoopus
    url: https://www.canishoopus.com/rss/index.xml

  - name: Bright Side of the Sun
    url: https://www.brightsideofthesun.com/rss/index.xml

  - name: Blazer's Edge
    url: https://www.blazersedge.com/rss/index.xml

  - name: Pounding The Rock
    url: https://www.poundingtherock.com/rss/index.xml

  - name: Raptors HQ
    url: https://www.raptorshq.com/rss/index.xml

  - name: SLC Dunk
    url: https://www.slcdunk.com/rss/index.xml

  - name: Bullets Forever
    url: https://www.bulletsforever.com/rss/index.xml

  # A beat NEWSPAPER, not a fan site -- the only local paper found so far
  # with working team-scoped RSS. Exactly what coverage gaps will want.
  - name: LA Times Lakers
    url: https://www.latimes.com/sports/lakers/rss2.0.xml

# --- Rejected, do not re-add without re-verifying --------------------------
# Probed 2026-08-15. The hit rate was 14 of 38, far worse than the 28 of 30
# the general-news build managed, and the misses are not small sites -- they
# are the biggest names in NBA coverage. Sports media went app- and
# paywall-first and took RSS with it. Plan around their absence.
#
#   Bleacher Report  syndication.bleacherreport.com/amp/nba.rss   410 Gone
#                    bleacherreport.com/articles/feed             404
#                    410 means deliberately retired, not broken.
#   The Athletic     no public feed, paywalled
#   NBA.com          /rss/nba_rss.xml 404; /news/rss.xml parses with 0 entries
#   The Ringer       404 on /rss/index.xml and /rss/nba/index.xml
#   SI               404 on /rss/si_nba.rss and /.rss/full/
#   NBC Sports       404 on /nba/rss, 0 entries on /feed/
#   FOX Sports       api.foxsports.com/v1/rss?tag=nba  0 entries
#   HoopsHype        404 on /feed/ and /rss/
#   Slam             403, blocks non-browser user agents
#   Sportskeeda      405 on /feed/basketball
#   USA Today NBA    404
#   Reuters Sports   404, same as their news feeds -- no public RSS
#   ClutchPoints     429 on two attempts. Rate-limited rather than dead;
#                    worth one more try later.
#   Basketball Ins.  parses fine, newest item 4,941h old. Site is abandoned.
#   Amico Hoops      newest item 302h old
#   Def Pen Hoops    newest item 145h old
#   BasketNews       /rss.xml returns 200 with zero items
#   HoopsHabit       fresh and busy, but items carry no description -- the
#                    lede is most of what the embedder sees, so it would
#                    cluster on headlines alone
#   Athlon Sports    was in the feed list; dropped. All-sport feed only
#                    (guessed NBA paths 403/404), clustered at 7/50, and
#                    paired with other general feeds on non-NBA stories.
#   FanSided network fresh and busy, but no descriptions on any site tried
#                    (HoopsHabit, Lake Show Life -- 2 of 2). Treat the whole
