services:
  - type: web
    name: presswake
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      # Transaction-mode pooler (port 6543). Set the value in the Render
      # dashboard -- do not commit it here.
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.12"
 
# Note: migrations deliberately do NOT run here. They run in the GitHub Actions
# workflow before each ingest, using the session-mode pooler. Running them from
# a spin-down-prone free web service would be unreliable.