name: ingest

on:
  schedule:
    # Hourly. Not more often: each run wakes the database, and news RSS does
    # not move fast enough to justify the compute.
    - cron: "0 * * * *"
    # The daily merge run, at :30 so it cannot collide with an hourly run
    # still in flight. The merge step below keys on this exact string --
    # change one and you must change both.
    - cron: "30 6 * * *"
  # Lets you run this by hand from the Actions tab instead of waiting an hour
  # to find out whether it works. Do not remove.
  workflow_dispatch:

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # 30, not 15: a full summarize batch alone is ~9 min (25 stories paced
    # 20s apart for Groq's TPM ceiling), plus a minute or two of torch
    # install on a cold pip cache.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # CPU torch first, from PyTorch's own index -- installing
      # sentence-transformers bare would pull the ~2 GB CUDA torch build.
      - run: pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt -r requirements-worker.txt

      - name: Run migrations
        env:
          # Session-mode pooler (port 5432 on pooler.supabase.com).
          # The plain direct string is IPv6-only and will not resolve here.
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: alembic upgrade head

      - name: Fetch feeds
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: python -m worker.ingest

      # Pipeline order matters: cluster only sees embedded articles, and
      # summarize only sees clustered stories. Each step is incremental and
      # idempotent -- a failed run is picked up by the next hour's run.
      - name: Embed new articles
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: python -m worker.embed

      - name: Cluster new articles
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: python -m worker.cluster --no-merge

      # Daily, not hourly. Each pass scores only stories whose centroid
      # changed since the last one (stories.needs_merge), so a day's worth
      # batches into one small in-database query and 23 idle passes buy
      # nothing. Keyed on the schedule string because cron fires can start
      # late -- gating on the clock hour would skip a delayed run. Also on
      # manual dispatch, so a hand-run pipeline is the whole pipeline.
      # Before summarize on purpose: a story that absorbs another this run
      # crosses the regen growth bar this run, not tomorrow.
      - name: Merge stories (daily)
        if: github.event.schedule == '30 6 * * *' || github.event_name == 'workflow_dispatch'
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: python -m worker.cluster --merge-only

      - name: Summarize stories
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          # Missing secret -> empty key -> the worker prints a skip message
          # and exits 0, so this step is safe to merge before the secret
          # exists.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m worker.summarize

      # Runs after clustering, since a story has to exist before it can be
      # tagged, but independently of summarize: the summary floor is 5
      # outlets while the feed shows 2, so most stories are categorised
      # without ever being summarised. Uses the small Groq model, whose
      # rate limit is a separate pool, so a large backlog here cannot
      # starve summarization.
      - name: Categorize stories
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m worker.categorize

      # After categorize so fresh team tags count toward scores, and here as
      # well as in briefs.yml so importance keeps moving even if that
      # workflow is ever disabled. Pure arithmetic -- no key, no LLM.
      - name: Recompute importance
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: python -m worker.importance

      # Retries comments the classifier could not reach when they were
      # posted. Without this, a provider outage leaves them invisible
      # forever -- which is the failure that makes moderation read as a bug.
      - name: Resolve pending comments
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m worker.moderate
